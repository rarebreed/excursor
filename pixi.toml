[workspace]
authors = ["Sean Toner <placeoftheway@gmail.com>"]
channels = ["conda-forge"]
name = "excursor"
platforms = ["linux-64", "win-64"]
version = "0.1.0"

[tasks]
fmt = "autopep8 -i -r ."
lint = "ruff check --fix ."

[dependencies]
python = ">=3.14.3,<3.15"
rust = ">=1.93.1,<1.94"
loguru = ">=0.7.3,<0.8"
pytest = ">=9.0.2,<10"

[feature.dev.dependencies]
autopep8 = ">=2.3.2,<3"
ruff = ">=0.15.5,<0.16"

[feature.test.dependencies]
pytest = ">=9.0.2,<10"
pytest-asyncio = ">=1.3.0,<2"

[environments]
dev = ["dev"]
test = ["test"]

[pypi-dependencies]
fastapi = { version = ">=0.135.1, <0.136", extras = ["standard"] }
pylance = ">=0.39.0, <0.40"
pyarrow = ">=23.0.1, <24"
daft = { version = ">=0.7.4, <0.8", extras = ["lance", "aws"] }
lancedb = ">=0.29.2, <0.30"
