[workspace]
authors = ["Sean Toner <placeoftheway@gmail.com>"]
channels = ["conda-forge"]
name = "excursor"
platforms = ["linux-64", "win-64"]
version = "0.1.0"

[tasks]
fmt = "autopep8 -i -r ."
lint = "ruff check --fix ."

[dependencies]
python = "3.13.*"
rust = ">=1.93.0,<1.94"
loguru = ">=0.7.3,<0.8"
pytest = ">=9.0.2,<10"

[feature.dev.dependencies]
autopep8 = "*"
ruff = "*"

[feature.test.dependencies]
pytest = "*"
pytest-asyncio = "*"

[environments]
dev = ["dev"]
test = ["test"]

[pypi-dependencies]
fastapi = { version = "*", extras = ["standard"] }
pylance = ">=2.0.1, <3"
pyarrow = ">=23.0.1, <24"
daft = { version = ">=0.6.14, <0.7", extras = ["lance", "aws"] }
